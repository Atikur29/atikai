name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on:ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android

      - name: Unzip project files
        run: |
          unzip -o atik-ai.zip -d extracted_temp
          # Move contents of subfolder if exists
          if [ -d "extracted_temp/atik-ai" ]; then
            cp -rn extracted_temp/atik-ai/* . || true
            cp -rn extracted_temp/atik-ai/.* . || true
          else
            cp -rn extracted_temp/* . || true
            cp -rn extracted_temp/.* . || true
          fi
          rm -rf extracted_temp

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
