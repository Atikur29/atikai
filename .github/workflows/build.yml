name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and locate project files
        run: |
          unzip -o atik-ai.zip -d extracted_temp
          # Find the folder containing pubspec.yaml and move everything here
          PUBSPEC_DIR=$(find extracted_temp -name "pubspec.yaml" -exec dirname {} \;)
          cp -rn $PUBSPEC_DIR/* . || true
          cp -rn $PUBSPEC_DIR/.* . || true
          rm -rf extracted_temp

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
